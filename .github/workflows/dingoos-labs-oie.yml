name: DingoOS Objective Innovation Evaluator

on:
  push:
    branches:
      - labs/objective-innovation-engine-001
  pull_request:
    branches:
      - dingoos/recovery-engine-adopted-requirements

jobs:
  oie-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/labs
