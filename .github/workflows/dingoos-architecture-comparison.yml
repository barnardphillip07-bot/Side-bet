name: DingoOS Architecture Comparison Topology Smoke Tests

on:
  push:
    branches:
      - dingoos/recovery-engine-adopted-requirements
  pull_request:
    branches:
      - main

jobs:
  topology-smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run topology smoke tests
        run: python -m unittest discover -s tests/architecture_comparison -v
      - name: Emit topology comparison evidence
        run: python -m experiments.dingoos_architecture_comparison.runner > wlc001-architecture-smoke.json
      - name: Preserve raw smoke result
        uses: actions/upload-artifact@v4
        with:
          name: wlc001-architecture-smoke
          path: wlc001-architecture-smoke.json
          if-no-files-found: error
